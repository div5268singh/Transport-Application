<section class="mx-auto max-w-xl px-4 py-10 sm:px-6 lg:px-8">
  <article class="rounded-xl border border-slate-200 bg-white p-6">
    <h1 class="text-2xl font-bold text-slate-900">Driver Login</h1>
    <p class="mt-2 text-sm text-slate-600">Use the credentials shared by email when the consignment was created.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4">
      <div>
        <label for="driver-username" class="mb-1 block text-sm font-medium text-slate-700">Username</label>
        <input id="driver-username" formControlName="username" class="w-full rounded border border-slate-300 px-3 py-2" />
      </div>

      <div>
        <label for="driver-password" class="mb-1 block text-sm font-medium text-slate-700">Password</label>
        <input id="driver-password" type="password" formControlName="password" class="w-full rounded border border-slate-300 px-3 py-2" />
      </div>

      <button type="submit" [disabled]="loading" class="rounded bg-slate-900 px-5 py-2 text-white hover:bg-slate-700">
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <p *ngIf="errorMessage" class="mt-4 rounded border border-rose-200 bg-rose-50 px-4 py-2 text-sm text-rose-700">{{ errorMessage }}</p>
  </article>
</section>
