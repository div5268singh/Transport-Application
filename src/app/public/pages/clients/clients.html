<section class="bg-slate-900 py-16 text-white">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <h1 class="text-4xl font-bold">Our Clients</h1>
    <p class="mt-3 text-sm text-slate-200">Home / Pages / Clients</p>
  </div>
</section>

<section class="mx-auto max-w-7xl px-4 py-14 sm:px-6 lg:px-8">
  <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
    @for (client of clients; track client.name) {
      <article class="rounded-lg border border-slate-200 bg-white p-5 text-center shadow-sm">
        <img [src]="client.logoPath" [alt]="client.name" class="mx-auto h-14 w-auto object-contain" />
        <p class="mt-4 text-sm font-semibold text-slate-800">{{ client.name }}</p>
      </article>
    }
  </div>
</section>
