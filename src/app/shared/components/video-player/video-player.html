<figure class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
  @if (embedVideoUrl) {
    <iframe
      class="h-72 w-full bg-black"
      [src]="embedVideoUrl"
      title="Embedded video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen
    ></iframe>
  } @else {
    <video class="h-72 w-full bg-black object-cover" controls [src]="item.videoPath" [attr.poster]="item.posterPath || null">
      Your browser does not support HTML5 video playback.
    </video>
  }
  <figcaption class="p-4">
    <h3 class="text-lg font-semibold text-slate-900">{{ item.title }}</h3>
    <p class="mt-2 text-sm text-slate-600">{{ item.summary }}</p>
  </figcaption>
</figure>
