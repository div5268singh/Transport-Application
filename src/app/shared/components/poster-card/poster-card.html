<article class="service-card">
  <div class="service-card__media">
    <img [src]="item.imagePath" [alt]="item.title" />
  </div>
  <div class="service-card__body">
    <span class="service-card__number">0{{ item.title.length % 6 + 1 }}</span>
    <h3>{{ item.title }}</h3>
    <p>{{ item.summary }}</p>
    <a routerLink="/services" [attr.aria-label]="content('shared.posterAriaPrefix') + ' ' + item.title">{{ content('shared.posterAction') }} <span aria-hidden="true">&rarr;</span></a>
  </div>
</article>
