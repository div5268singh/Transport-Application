<article class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm transition hover:shadow-md">
  <img [src]="item.imagePath" [alt]="item.title" class="h-44 w-full object-cover" />
  <div class="p-4">
    <h3 class="text-lg font-semibold text-slate-900">{{ item.title }}</h3>
    <p class="mt-2 text-sm text-slate-600">{{ item.summary }}</p>
  </div>
</article>
